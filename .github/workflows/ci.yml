name: CI (Checks, Tests, Benchmark & Build)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run Clippy (-D warnings)
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy.log" || {
            grep -E "(error|warning:|--> )" "$RUNNER_TEMP/clippy.log" | head -n 10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
      - name: Run Rust core tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee "$RUNNER_TEMP/test.log" || {
            grep -E "(FAILED|error|panicked at|test result:)" "$RUNNER_TEMP/test.log" | head -n 10 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
      - name: Check formatting
        shell: bash
        run: |
          if ! cargo fmt --all -- --check > "$RUNNER_TEMP/fmt.log" 2>&1; then
            awk '/^Diff in /{cur=$0; next} /^[+-]/{print "::error::" cur " | " $0}' "$RUNNER_TEMP/fmt.log" | head -n 10
            cat "$RUNNER_TEMP/fmt.log"
            exit 1
          fi
      - name: Verify no copyrighted upstream textures tracked in git
        shell: bash
        run: |
          if git ls-files | grep -E '^(assets-local/|user-projects/)'; then
            echo "ERROR: Local upstream textures or user projects must never be committed!"
            exit 1
          fi

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run benchmark
      - run: npm run build
      - name: Verify no copyrighted upstream textures tracked in git
        run: |
          if git ls-files | grep -E '^(assets-local/|user-projects/)'; then
            echo "ERROR: Local upstream textures or user projects must never be committed!"
            exit 1
          fi
