[package]
name = "factory-atlas-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core production chain solver, .factoryatlas v2 format, NBT/JAR parsers, visual matcher, and 3D MC JSON resolver for Factory Atlas"

[dependencies]
directories = "6.0"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25.5", default-features = false, features = ["png"] }
zip = { version = "9.7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
