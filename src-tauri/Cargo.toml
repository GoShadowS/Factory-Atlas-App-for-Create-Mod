[package]
name = "factory-atlas"
version = "0.1.0"
description = "Factory Atlas — Offline Create Production Chain Planner"
authors = ["Factory Atlas Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "factory_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
